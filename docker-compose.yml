version: '3.8'

services:
  ai-service:
    build: .
    container_name: lunetterie-ai
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cpu
    volumes:
      - ./app/models:/app/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
